<style>
  :root{
    --ink:#161616; --muted:#6b6b6b; --line:#e7e7e3;
    --card:#ffffff; --bg:#f4f4f2; --dot:#d9d9d4; --radius:18px;
    --shadow:0 1px 2px rgba(0,0,0,.04), 0 12px 30px -12px rgba(0,0,0,.18);
    --shadow-hi:0 2px 6px rgba(0,0,0,.06), 0 30px 60px -18px rgba(0,0,0,.30);
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; overflow:hidden;
    font-family:"Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color:var(--ink); background-color:var(--bg);
    background-image:radial-gradient(var(--dot) 1.1px, transparent 1.2px);
    background-size:22px 22px; background-position:-11px -11px;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; user-select:none;
  }
  .stage{ position:fixed; left:50%; top:50%; width:1200px; height:820px; transform:translate(-50%,-50%); transform-origin:center center; }

  .card{
    position:absolute; touch-action:none; cursor:grab;
    transition:box-shadow .25s ease, transform .25s cubic-bezier(.2,.7,.2,1);
    animation:pop .6s cubic-bezier(.2,.7,.2,1) backwards; animation-delay:var(--d,0s);
    will-change:transform; transform:rotate(var(--tilt,0deg));
  }
  .card:active{ cursor:grabbing; }
  .card.dragging{ cursor:grabbing; transform:scale(1.03) rotate(var(--tilt,0deg)); }
  .card img{ pointer-events:none; -webkit-user-drag:none; user-drag:none; user-select:none; }
  @keyframes pop{ from{ opacity:0; transform:translateY(18px) scale(.96) rotate(var(--tilt,0deg)); } to{ opacity:1; } }

  /* ── Project card ── */
  .pcard{ width:302px; }
  .pcard .frame{
    border-radius:24px; padding:30px 30px 26px;
    box-shadow:var(--shadow);
    transition:box-shadow .25s ease, transform .25s cubic-bezier(.2,.7,.2,1);
  }
  .pcard:hover .frame{ box-shadow:var(--shadow-hi); transform:translateY(-4px); }
  .pcard .frame svg{ display:block; width:100%; height:auto; }
  .frame.gray{ background:radial-gradient(130% 130% at 50% 0%, #efefec 0%, #dbdbd6 100%); }
  .frame.graphite{ background:radial-gradient(130% 130% at 50% 0%, #3d3d40 0%, #1b1b1d 100%); }
  .frame.bluegray{ background:radial-gradient(130% 130% at 50% 0%, #edf1f6 0%, #d2d9e4 100%); }
  .frame.mint{ background:radial-gradient(130% 130% at 50% 0%, #eaf4ee 0%, #cee6d8 100%); }
  .frame.cta{ background:radial-gradient(130% 130% at 20% 0%, #2a2a2d 0%, #131315 100%); color:#fff;
    min-height:222px; display:flex; flex-direction:column; align-items:flex-start; justify-content:center; padding:28px 28px; }
  .cta-eyebrow{ display:inline-flex; align-items:center; gap:7px; font-size:11px; letter-spacing:.12em; font-weight:600; color:#b9b9bd; }
  .cta-dot{ width:7px; height:7px; border-radius:50%; background:#22c55e; box-shadow:0 0 0 0 rgba(34,197,94,.5); animation:ctaPulse 2.2s ease-out infinite; }
  @keyframes ctaPulse{ 0%{ box-shadow:0 0 0 0 rgba(34,197,94,.5);} 70%{ box-shadow:0 0 0 7px rgba(34,197,94,0);} 100%{ box-shadow:0 0 0 0 rgba(34,197,94,0);} }
  .cta-title{ font-size:26px; font-weight:600; letter-spacing:-.02em; line-height:1.08; margin:14px 0 10px; }
  .cta-sub{ font-size:13px; line-height:1.5; color:#a7a7ac; max-width:230px; }
  .cta-btn{ margin-top:18px; background:#fff; color:#121212; font-size:13px; font-weight:600; padding:9px 16px; border-radius:999px; }

  .project-meta{ display:flex; align-items:center; gap:10px; margin-top:16px; padding-left:4px; }
  .project-meta .name{ font-size:16px; font-weight:600; }
  .pill{ font-size:12.5px; color:#4b4b4b; background:#ececea; border:1px solid #e2e2df; padding:4px 10px; border-radius:8px; font-weight:500; }

  /* ── Dock ── */
  .dock{ position:absolute; left:50%; bottom:30px; transform:translateX(-50%);
    display:flex; align-items:center; gap:6px; background:#1a1a1a; padding:9px 12px; border-radius:999px;
    box-shadow:0 10px 30px -8px rgba(0,0,0,.55); z-index:5000;
    animation:pop .6s cubic-bezier(.2,.7,.2,1) backwards; animation-delay:.5s; }
  .dock a{ width:38px; height:38px; border-radius:50%; display:grid; place-items:center; color:#cfcfcf; text-decoration:none;
    transition:transform .18s cubic-bezier(.3,1.4,.5,1), background .2s ease, color .2s ease; }
  .dock a:hover{ color:#fff; background:rgba(255,255,255,.12); transform:translateY(-6px) scale(1.12); }
  .dock a.current{ color:#fff; background:rgba(255,255,255,.16); }
  .dock .sep{ width:1px; height:20px; background:rgba(255,255,255,.14); margin:0 4px; }
.dock a{ position:relative; }
  .dock a::after{ content:attr(data-tip); position:absolute; bottom:calc(100% + 10px); left:50%; transform:translateX(-50%) translateY(4px); background:#1a1a1a; color:#fff; font-size:11px; font-weight:500; padding:5px 9px; border-radius:7px; white-space:nowrap; opacity:0; pointer-events:none; transition:opacity .15s ease, transform .15s ease; box-shadow:0 6px 16px -6px rgba(0,0,0,.5); z-index:10; }
  .dock a:hover::after{ opacity:1; transform:translateX(-50%) translateY(0); }

  .hint{ position:fixed; left:50%; top:26px; transform:translateX(-50%); font-size:12.5px; color:var(--muted);
    background:rgba(255,255,255,.7); backdrop-filter:blur(6px); border:1px solid var(--line);
    padding:7px 14px; border-radius:999px; z-index:6000; animation:hintFade 5s ease forwards 1.2s; pointer-events:none; }
  @keyframes hintFade{ 0%{opacity:0;transform:translate(-50%,-6px);} 12%{opacity:1;transform:translate(-50%,0);} 80%{opacity:1;} 100%{opacity:0;transform:translate(-50%,-6px);} }
  @media (max-width:560px){ .hint{ display:none; } }

  /* ============ RESPONSIVE — reflow the canvas into a scrollable stack on phones ============ */
  @media (max-width:768px){
    html,body{ height:auto; }
    body{ overflow-x:hidden; overflow-y:auto; }
    .stage{
      position:static; left:auto; top:auto;
      width:auto; height:auto; min-height:100vh;
      transform:none !important;
      display:flex; flex-direction:column; align-items:center; gap:16px;
      padding:26px 16px 104px; box-sizing:border-box;
    }
    .stage .card{
      position:relative !important; left:auto !important; top:auto !important;
      width:100% !important; max-width:430px !important;
      transform:none !important; cursor:default; animation:none;
    }
    .card:hover{ transform:none; }
    .stage .card img, .stage .card iframe{ max-width:100%; }
    .dock{ position:fixed !important; bottom:16px !important; z-index:5000; }
    .hint{ display:none; }
  }

<script>
  const stage = document.getElementById('stage');
  const STAGE_W = 1200, STAGE_H = 820;
  const isMobile = () => window.matchMedia('(max-width:768px)').matches;
  function fitStage(){
    if(isMobile()){ stage.style.transform = 'none'; stage.dataset.scale = 1; return; }
    const pad = 48;
    const scale = Math.min(1, (window.innerWidth - pad)/STAGE_W, (window.innerHeight - pad)/STAGE_H);
    stage.style.transform = `translate(-50%,-50%) scale(${scale})`;
    stage.dataset.scale = scale;
  }
  window.addEventListener('resize', fitStage); fitStage();

  let zTop = 100;
  document.querySelectorAll('.card').forEach(makeDraggable);
  function makeDraggable(el){
    let dragging=false, moved=false, startX, startY, origX, origY;
    let vX=0, vY=0, lastX, lastY, lastT, raf=null;
    el.addEventListener('pointerdown', (e) => {
      if (isMobile()) return;
      if (e.target.closest('a')) return;
      dragging=true; moved=false;
      el.setPointerCapture(e.pointerId); cancelAnimationFrame(raf);
      el.classList.add('dragging'); el.style.zIndex = ++zTop;
      startX=e.clientX; startY=e.clientY;
      origX=parseFloat(el.style.left); origY=parseFloat(el.style.top);
      lastX=e.clientX; lastY=e.clientY; lastT=performance.now();
    });
    el.addEventListener('pointermove', (e) => {
      if(!dragging) return;
      const scale = parseFloat(stage.dataset.scale) || 1;
      const dx=(e.clientX-startX)/scale, dy=(e.clientY-startY)/scale;
      if (Math.abs(dx)+Math.abs(dy) > 2) moved=true;
      el.style.left=(origX+dx)+'px'; el.style.top=(origY+dy)+'px';
      const now=performance.now(), dt=Math.max(now-lastT,8);
      vX=((e.clientX-lastX)/scale)/dt*16; vY=((e.clientY-lastY)/scale)/dt*16;
      lastX=e.clientX; lastY=e.clientY; lastT=now;
    });
    const end = () => {
      if(!dragging) return; dragging=false; el.classList.remove('dragging');
      const friction=0.90;
      const glide=()=>{ vX*=friction; vY*=friction;
        if(Math.abs(vX)<0.15 && Math.abs(vY)<0.15) return;
        el.style.left=(parseFloat(el.style.left)+vX)+'px';
        el.style.top=(parseFloat(el.style.top)+vY)+'px';
        raf=requestAnimationFrame(glide);
      };
      if(moved) raf=requestAnimationFrame(glide);
      else if(el.dataset.href){                                          // a click, not a drag
        const h = el.dataset.href;
        if(/^https?:\/\//i.test(h)) window.open(h, '_blank', 'noopener'); // external → new tab
        else window.location.href = h;                                   // internal page / mailto
      }
    };
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
  }
</script>
